<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视选题辩论室 V2</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel-bg: #16213e;
            --chat-bg: #0f3460;
            --text: #e0e0e0;
            --accent: #e94560;
            --msg-ai: #1a1a3e;
            --msg-user: #0f4c75;
            --border: #2a2a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .panel {
            width: 25%;
            min-width: 280px;
            background: var(--panel-bg);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }
        .panel h2 { font-size: 18px; text-align: center; color: var(--accent); margin-bottom: 6px; }
        .panel label { font-size: 12px; color: #aaa; margin-bottom: -8px; }
        .panel input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .panel input:focus { border-color: var(--accent); }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-save { background: var(--accent); color: #fff; }
        .btn-stop { background: #ff6b6b; color: #fff; }
        .btn-clear { background: #444; color: #fff; }
        .btn-next { background: #4caf50; color: #fff; }
        .btn-save:hover { opacity: 0.85; }
        .btn-stop:hover { opacity: 0.85; }
        .btn-clear:hover { opacity: 0.85; }
        .btn-next:hover { opacity: 0.85; }
        .status {
            font-size: 12px;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            background: var(--bg);
        }
        .status.idle { color: #aaa; }
        .status.running { color: #4caf50; animation: pulse 1.5s infinite; }
        .status.paused { color: #ffa500; }
        .status.stopped { color: #ff6b6b; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }
        .input-area {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--panel-bg);
        }
        .input-area textarea {
            flex: 1;
            height: 70px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        .btn-debate { background: var(--accent); color: #fff; height: 40px; white-space: nowrap; }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-row {
            display: flex;
            gap: 10px;
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }
        .msg-body {
            flex: 1;
            background: var(--msg-ai);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.6;
        }
        .msg-body.user { background: var(--msg-user); }
        .msg-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .msg-meta .name { font-weight: bold; color: var(--accent); }
        .msg-content { white-space: pre-wrap; word-break: break-word; }
        .msg-error { background: #4a1a1a !important; color: #ff6b6b; font-size: 12px; }
        .user-intervene {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .user-intervene input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .user-intervene input:focus { border-color: var(--accent); }
        .btn-send { background: var(--accent); color: #fff; }
        .next-round-hint {
            text-align: center;
            color: #ffa500;
            font-size: 12px;
            padding: 8px;
            margin-top: 8px;
            border: 1px dashed #ffa500;
            border-radius: 6px;
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .panel {
                width: 100%;
                min-width: auto;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px;
            }
            .panel h2 { width: 100%; font-size: 16px; }
            .panel label { display: none; }
            .panel input { flex: 1; min-width: 100px; }
            .main { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <h2>⚙️ 辩论室配置 V2</h2>

        <label>DeepSeek API Key（逻辑纠察）</label>
        <input type="password" id="key-deepseek" placeholder="sk-...">

        <label>豆包 API Key（流量雷达）</label>
        <input type="password" id="key-doubao" placeholder="火山引擎 API Key">

        <label>豆包模型接入点 ID</label>
        <input type="text" id="doubao-model-id" placeholder="ark-xxxxxxxxxxxx">

        <label>DeepSeek API Key（人文显微镜）</label>
        <input type="password" id="key-deepseek2" placeholder="sk-...（可填同一个Key）">

        <label>通义千问 API Key（人间嘴替）</label>
        <input type="password" id="key-qwen" placeholder="sk-...">

        <label>智谱清言 API Key（专业抬杠）</label>
        <input type="password" id="key-zhipu" placeholder="...">

        <button class="btn btn-save" onclick="saveKeys()">💾 保存配置</button>
        <button class="btn btn-stop" onclick="stopDebate()">⏹️ 停止辩论</button>
        <button class="btn btn-next" onclick="startNextRound()">▶️ 继续下一轮</button>
        <button class="btn btn-clear" onclick="clearChat()">🗑️ 清空对话</button>
        <div class="status idle" id="status-indicator">● 空闲</div>
        <div class="next-round-hint" id="next-hint" style="display:none;">💡 辩论已暂停，等待你的指令。<br>你可以直接插话，然后点击“继续下一轮”。</div>
    </div>

    <div class="main">
        <div class="input-area">
            <textarea id="material-input" placeholder="在此粘贴豆瓣/B站/知乎资料..."></textarea>
            <button class="btn btn-debate" onclick="startDebate()">🚀 开始辩论</button>
        </div>
        <div class="chat-area" id="chat-area">
            <div style="text-align:center;color:#666;margin-top:60px;font-size:14px;">
                📺 影视选题辩论室 V2<br><span style="font-size:12px;">粘贴资料 → 开始辩论 → 每轮结束等待你插话 → 点“继续下一轮”</span>
            </div>
        </div>
        <div class="user-intervene" style="padding:10px 16px;border-top:1px solid var(--border);background:var(--panel-bg);">
            <input type="text" id="user-intervene-input" placeholder="在此输入插话指令，回车发送..." onkeydown="if(event.key==='Enter')sendIntervene()">
            <button class="btn btn-send" onclick="sendIntervene()">发送</button>
        </div>
    </div>

    <script>
        (function() {
            let debateRunning = false;
            let stopFlag = false;
            let isPaused = false;
            let currentRound = 0;
            let chatHistory = [];
            const MODEL_LIST = ['deepseek', 'doubao', 'deepseek2', 'qwen', 'zhipu'];

            const MODEL_NAMES = {
                deepseek: 'DeepSeek · 逻辑纠察',
                doubao: '豆包 · 流量雷达',
                deepseek2: 'DeepSeek · 人文显微镜',
                qwen: '通义千问 · 人间嘴替',
                zhipu: '智谱 · 专业抬杠'
            };

            const MODEL_COLORS = {
                deepseek: '#4caf50',
                doubao: '#2196f3',
                deepseek2: '#ff9800',
                qwen: '#9c27b0',
                zhipu: '#f44336'
            };

            const SYSTEM_PROMPT = `你是一个影视解说选题策划智囊团的成员。你参与一场多人的选题辩论会，你和另外4位AI角色正在一个群聊中讨论。
            
            ## 核心规则（必须无条件遵守）
            1. 用户是辩论主持人，拥有绝对控制权。
            2. 如果用户在聊天记录中插入了新的指令（以“【插话】”开头的内容），你必须优先响应这个新指令。
            3. 禁止忽略用户的插话，也禁止只是简单同意然后继续自己原来的话题。

            ## 你的角色人设
            [此处在实际调用时会被替换为各模型对应的人设]

            ## 核心红线（绝对不能违反）
            1. 绝对不能为了反常识而反常识，所有观点都必须能自圆其说，有足够的资料或影视情节作为支撑。
            2. 绝对不能涉及任何敏感话题，不能把影视人物和当代政治人物进行类比。
            3. 任何质疑或反驳，必须附带具体的证据引用（来自用户提供的资料或影视情节）。无证据的纯抬杠无效。

            ## 辩论规则
            1. 第一轮：基于用户提供的资料，结合你的人设，各自提出一个爆款选题方向。
            2. 从第二轮开始：仔细阅读所有发言，并点评、质疑、反驳或补充。
            3. 禁止简单同意。如果同意，必须提供全新的论据支撑。
            4. 禁止跑题。始终围绕用户的资料和指令展开。

            ## 输出要求
            - 语言风格要符合你的人设，保持辩论的张力。
            - 如果是第一轮发言，输出：【选题方向】+ 你的选题钩子 + 简短理由。
            - 如果不是第一轮，先表明态度（同意/反对/补充），再给出论据。`;

            const PERSONAS = {
                deepseek: '你是"逻辑纠察队队长"。坚信影视作品的根基是叙事逻辑和人物行为动机的合理性。你的选题永远指向"这个故事本身说得圆吗"。',
                doubao: '你是"流量雷达探测器"。你的大脑就是抖音算法的模拟器，对社会情绪、大众痛点极度敏感。你的选题永远指向"这个能不能火"。',
                deepseek2: '你是"人文显微镜操作员"。你专注考据、隐喻解读、镜头语言分析。你的选题让人看完觉得"涨知识了"。',
                qwen: '你是"人间清醒嘴替"。你擅长从角色关系、情感困境中提炼出能让观众共鸣的人生真相。',
                zhipu: '你是"专业抬杠运动员"。你的天职是质疑一切主流观点，为少数派发声，但必须有证据。'
            };

            // ============ UI辅助函数 ============
            function showHint(show) {
                const hint = document.getElementById('next-hint');
                if (hint) hint.style.display = show ? 'block' : 'none';
            }

            window.saveKeys = function() {
                MODEL_LIST.forEach(model => {
                    const input = document.getElementById('key-' + model);
                    if (input && input.value.trim()) {
                        localStorage.setItem('debate_key_' + model, input.value.trim());
                    }
                });
                const doubaoModelInput = document.getElementById('doubao-model-id');
                if (doubaoModelInput && doubaoModelInput.value.trim()) {
                    localStorage.setItem('doubao_model_id', doubaoModelInput.value.trim());
                }
                alert('✅ 所有配置已保存');
            };

            window.loadKeys = function() {
                MODEL_LIST.forEach(model => {
                    const saved = localStorage.getItem('debate_key_' + model);
                    const input = document.getElementById('key-' + model);
                    if (saved && input) input.value = saved;
                });
                const doubaoModelSaved = localStorage.getItem('doubao_model_id');
                const doubaoModelInput = document.getElementById('doubao-model-id');
                if (doubaoModelSaved && doubaoModelInput) doubaoModelInput.value = doubaoModelSaved;
            };

            window.getKey = function(model) {
                const input = document.getElementById('key-' + model);
                if (input && input.value.trim()) return input.value.trim();
                return localStorage.getItem('debate_key_' + model) || '';
            };

            function getDoubaoModelId() {
                const input = document.getElementById('doubao-model-id');
                if (input && input.value.trim()) return input.value.trim();
                return localStorage.getItem('doubao_model_id') || '';
            }

            window.clearChat = function() {
                chatHistory = [];
                document.getElementById('chat-area').innerHTML = '<div style="text-align:center;color:#666;margin-top:60px;font-size:14px;">📺 影视选题辩论室 V2<br><span style="font-size:12px;">粘贴资料 → 开始辩论 → 每轮结束等待你插话 → 点“继续下一轮”</span></div>';
                showHint(false);
            };

            window.setStatus = function(state) {
                const el = document.getElementById('status-indicator');
                if (!el) return;
                el.className = 'status ' + state;
                if (state === 'idle') el.textContent = '● 空闲';
                if (state === 'running') el.textContent = '● 辩论中...';
                if (state === 'paused') el.textContent = '⏸️ 等待指令';
                if (state === 'stopped') el.textContent = '● 已停止';
            };

            window.addMessage = function(role, model, content, isError) {
                const area = document.getElementById('chat-area');
                if (!area) return;
                const row = document.createElement('div');
                row.className = 'msg-row';
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (role === 'user') {
                    avatar.style.background = '#e94560';
                    avatar.textContent = '我';
                } else {
                    avatar.style.background = MODEL_COLORS[model] || '#666';
                    avatar.textContent = MODEL_NAMES[model] ? MODEL_NAMES[model].charAt(0) : '?';
                }
                const body = document.createElement('div');
                body.className = 'msg-body';
                if (role === 'user') body.classList.add('user');
                if (isError) body.classList.add('msg-error');
                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = role === 'user' ? '我' : (MODEL_NAMES[model] || model);
                const timeSpan = document.createElement('span');
                timeSpan.textContent = new Date().toLocaleTimeString();
                meta.appendChild(nameSpan);
                meta.appendChild(timeSpan);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'msg-content';
                contentDiv.textContent = content;
                body.appendChild(meta);
                body.appendChild(contentDiv);
                row.appendChild(avatar);
                row.appendChild(body);
                area.appendChild(row);
                area.scrollTop = area.scrollHeight;
                if (!isError) {
                    chatHistory.push({ role, model, content, time: new Date().toISOString() });
                }
            };

            window.addUserMessage = function(content) {
                window.addMessage('user', null, content, false);
            };

            window.sendIntervene = function() {
                const input = document.getElementById('user-intervene-input');
                if (!input) return;
                const text = input.value.trim();
                if (!text) return;
                window.addUserMessage('【插话】' + text);
                input.value = '';
            };

            window.stopDebate = function() {
                stopFlag = true;
                debateRunning = false;
                isPaused = false;
                window.setStatus('stopped');
                showHint(false);
                window.addMessage('system', null, '⏹️ 辩论已停止', false);
            };

            // ============ API调用 ============
            async function callModelAPI(model, messages) {
                const apiKey = window.getKey(model);
                if (!apiKey) return { error: model + ' 未配置API Key' };
                const configs = {
                    deepseek: {
                        url: 'https://api.deepseek.com/v1/chat/completions',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: { model: 'deepseek-chat', messages, stream: false, max_tokens: 600, temperature: 0.85 }
                    },
                    doubao: {
                        url: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: { model: getDoubaoModelId() || 'doubao-lite', messages, stream: false, max_tokens: 600, temperature: 0.85 }
                    },
                    deepseek2: {
                        url: 'https://api.deepseek.com/v1/chat/completions',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: { model: 'deepseek-chat', messages, stream: false, max_tokens: 600, temperature: 0.85 }
                    },
                    qwen: {
                        url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: { model: 'qwen-turbo', messages, stream: false, max_tokens: 600, temperature: 0.85 }
                    },
                    zhipu: {
                        url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: { model: 'glm-4-flash', messages, stream: false, max_tokens: 600, temperature: 0.85 }
                    }
                };
                const cfg = configs[model];
                if (!cfg) return { error: '未知模型: ' + model };
                try {
                    const resp = await fetch(cfg.url, {
                        method: 'POST',
                        headers: cfg.headers,
                        body: JSON.stringify(cfg.body)
                    });
                    const data = await resp.json();
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        return { content: data.choices[0].message.content.trim() };
                    }
                    return { error: model + ' 返回异常: ' + JSON.stringify(data).substring(0, 200) };
                } catch (e) {
                    return { error: model + ' 调用失败: ' + e.message };
                }
            }

            // ============ 核心：单轮辩论 ============
            async function runSingleRound(roundNumber) {
                for (const model of MODEL_LIST) {
                    if (stopFlag) break;
                    const persona = PERSONAS[model] || '';
                    const systemPrompt = SYSTEM_PROMPT.replace('[此处在实际调用时会被替换为各模型对应的人设]', persona);
                    const msgs = [{ role: 'system', content: systemPrompt }];
                    for (const h of chatHistory) {
                        if (h.role === 'user') {
                            msgs.push({ role: 'user', content: h.content });
                        } else if (h.role === 'ai') {
                            const label = MODEL_NAMES[h.model] || h.model;
                            msgs.push({ role: 'assistant', content: '[' + label + ']: ' + h.content });
                        }
                    }
                    if (roundNumber === 1) {
                        msgs.push({ role: 'user', content: '（第一轮辩论：请基于用户提供的资料，提出一个爆款选题方向。）' });
                    } else {
                        msgs.push({ role: 'user', content: '（第' + roundNumber + '轮辩论：请继续发言，点评、质疑或补充。如果用户有新的插话指令，请优先响应。）' });
                    }
                    const result = await callModelAPI(model, msgs);
                    if (result.error) {
                        window.addMessage('ai', model, '❌ ' + result.error, true);
                    } else if (result.content) {
                        window.addMessage('ai', model, result.content, false);
                    }
                    await new Promise(r => setTimeout(r, 800));
                }
            }

            // ============ 开始辩论 ============
            window.startDebate = async function() {
                const materialInput = document.getElementById('material-input');
                if (!materialInput) return;
                const material = materialInput.value.trim();
                if (!material) { alert('请先粘贴影视资料'); return; }
                if (debateRunning) { alert('辩论正在进行中'); return; }
                stopFlag = false;
                debateRunning = true;
                isPaused = false;
                currentRound = 0;
                window.setStatus('running');
                window.addUserMessage('📋 资料：' + (material.length > 500 ? material.substring(0, 500) + '...' : material));
                const userMaterialMsg = '以下是一份影视作品的观众评论和讨论资料，请仔细阅读：\n\n' + material + '\n\n请基于以上资料，结合你的人设，提出一个爆款选题方向。';
                window.addUserMessage(userMaterialMsg);
                // 第一轮
                currentRound = 1;
                await runSingleRound(currentRound);
                if (!stopFlag) {
                    isPaused = true;
                    window.setStatus('paused');
                    showHint(true);
                }
            };

            // ============ 继续下一轮 ============
            window.startNextRound = async function() {
                if (!debateRunning || !isPaused) {
                    alert('辩论未在暂停状态');
                    return;
                }
                if (stopFlag) return;
                isPaused = false;
                showHint(false);
                window.setStatus('running');
                currentRound++;
                await runSingleRound(currentRound);
                if (!stopFlag) {
                    isPaused = true;
                    window.setStatus('paused');
                    showHint(true);
                }
            };

            window.onload = function() {
                window.loadKeys();
                window.clearChat();
                showHint(false);
            };
        })();
    </script>
